<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - Fix & Go Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #f4f6f8; 
  --s1: #ffffff; 
  --s2: #ffffff; 
  --s3: #f8f9fa; 
  --border: #e2e8f0; 
  --border2: #cbd5e1; 
  --text: #0f172a; 
  --muted: #64748b; 
  --muted2: #475569;
  --accent: #2563eb; 
  --accent-text: #ffffff; 
  --blue: #0284c7;
  --purple: #7c3aed;
  --orange: #ea580c;
  --red: #dc2626;
  --green: #16a34a;
  --yellow: #ca8a04;
}
html,body{height:100%;overflow:hidden;font-size:16px;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

#login-screen{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;align-items:center;justify-content:center;
}
.login-card{
  background:var(--s1);padding:40px;border-radius:16px;width:90%;max-width:380px;
  box-shadow:0 20px 25px -5px rgba(0,0,0,.1);border:1px solid var(--border);
}
.login-card h2{font-family:'Barlow',sans-serif;font-weight:900;margin-bottom:6px;color:var(--accent);font-size:1.6rem;letter-spacing:.02em;}
.login-card .sub{color:var(--muted);font-size:0.95rem;margin-bottom:24px;}
.login-card input{
  width:100%;padding:12px 14px;margin-bottom:12px;border:1px solid var(--border2);
  border-radius:8px;font-family:'Barlow',sans-serif;font-size:1rem;outline:none;
  transition:border .15s, box-shadow .15s;
}
.login-card input:focus{border-color:var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);}
.login-card button{
  width:100%;padding:12px;background:var(--accent);color:#fff;border:none;
  border-radius:8px;font-weight:800;font-family:'Barlow',sans-serif;font-size:1rem;
  cursor:pointer;transition:all .15s;margin-top:4px;
}
.login-card button:hover{background:#1d4ed8;}
.login-card button:disabled{opacity:.6;cursor:default;}
#login-error{color:var(--red);margin-top:12px;font-size:0.9rem;font-weight:600;min-height:1.2em;}

#topbar{
  height:70px;min-height:70px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid var(--border);
  background:var(--s1);
  z-index:200;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.logo{font-size:1.4rem;font-weight:900;letter-spacing:.06em;color:var(--accent)}
.logo span{color:var(--muted);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:12px}
.field{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:8px;padding:10px 16px;
  color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:1rem;
  outline:none;transition:border .15s, box-shadow .15s;width:100%;
}
.field:focus{border-color:var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.15);}
.field::placeholder{color:var(--muted)}
#search-input{width:280px;}
#date-filter{width:160px; font-family:'Barlow',sans-serif;}

.btn-add{
  background:var(--accent);color:var(--accent-text);border:none;
  padding:10px 20px;border-radius:8px;
  font-family:'Barlow',sans-serif;font-weight:700;font-size:1rem;
  cursor:pointer;letter-spacing:.02em;
  transition:all .15s;white-space:nowrap;
  box-shadow: 0 2px 4px rgba(37,99,235,0.2);
}
.btn-add:hover{background:#1d4ed8; box-shadow: 0 4px 6px rgba(37,99,235,0.3); transform: translateY(-1px);}

.btn-logout{
  background:var(--s1);border:1px solid var(--border2);color:var(--muted2);
  padding:10px 16px;border-radius:8px;font-family:'Barlow',sans-serif;font-weight:700;
  font-size:0.95rem;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn-logout:hover{border-color:var(--red);color:var(--red);background:#fef2f2;}

#app{display:flex;flex:1;overflow:hidden;flex-direction:column;}

#dashboard{display:flex;flex-direction:column;flex:1;overflow:hidden;}

.summary-bar{
  display:flex;gap:16px;padding:24px 24px 0 24px;overflow-x:auto;
}
.stat-card{
  flex:1;min-width:180px;border-radius:12px;padding:16px 20px;cursor:pointer;
  transition:all .15s; border: 2px solid transparent;
}
.stat-card:hover{transform:translateY(-2px);}
.sc-val{font-size:1.8rem;font-weight:900;margin-bottom:4px;}
.sc-label{font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;}

.sc-today { background: #dcfce7; border-color: #bbf7d0; }
.sc-today .sc-val { color: #166534; }
.sc-today .sc-label { color: #15803d; }
.sc-today.active { border-color: #22c55e; box-shadow: 0 4px 12px rgba(34,197,94,0.2); }

.sc-upcoming { background: #e0f2fe; border-color: #bae6fd; }
.sc-upcoming .sc-val { color: #075985; }
.sc-upcoming .sc-label { color: #0369a1; }
.sc-upcoming.active { border-color: #0ea5e9; box-shadow: 0 4px 12px rgba(14,165,233,0.2); }

.sc-noset { background: #fee2e2; border-color: #fecaca; }
.sc-noset .sc-val { color: #991b1b; }
.sc-noset .sc-label { color: #b91c1c; }
.sc-noset.active { border-color: #ef4444; box-shadow: 0 4px 12px rgba(239,68,68,0.2); }

.sc-quotations { background: #f3e8ff; border-color: #e9d5ff; }
.sc-quotations .sc-val { color: #6b21a8; }
.sc-quotations .sc-label { color: #7e22ce; }
.sc-quotations.active { border-color: #a855f7; box-shadow: 0 4px 12px rgba(168,85,247,0.2); }

.sc-further { background: #fef3c7; border-color: #fde68a; }
.sc-further .sc-val { color: #92400e; }
.sc-further .sc-label { color: #b45309; }
.sc-further.active { border-color: #f59e0b; box-shadow: 0 4px 12px rgba(245,158,11,0.2); }

.filters-wrap{
  padding:20px 24px;display:flex;gap:8px;flex-wrap:wrap;
}
.fchip{
  font-family:'IBM Plex Mono',monospace;font-size:0.9rem;font-weight:500;
  padding:8px 12px;border-radius:6px;
  border:1px solid var(--border2);
  background:var(--s1);color:var(--muted2);
  cursor:pointer;transition:all .15s;
}
.fchip:hover,.fchip.active{border-color:var(--accent);color:var(--accent);background:#eff6ff;}
.fchip.all.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}

#job-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;
  padding:0 24px 24px 24px;overflow-y:auto;flex:1;align-content:start;
}
.job-card{
  background:var(--s2);border:1px solid var(--border);border-radius:12px;
  padding:20px;cursor:pointer;transition:all .15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);display:flex;flex-direction:column;
}
.job-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow: 0 6px 16px rgba(0,0,0,0.06);}
.jc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.jc-ref{font-family:'IBM Plex Mono',monospace;font-size:0.85rem;color:var(--muted);font-weight:600;}
.jc-title{font-size:1.15rem;font-weight:800;color:var(--text);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jc-info-row{font-size:0.95rem;color:var(--muted2);margin-bottom:6px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.jc-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.tag{
  font-family:'IBM Plex Mono',monospace;font-size:0.75rem;font-weight:700;
  padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;
}
.t-type{background:#f1f5f9;color:var(--muted2);border:1px solid var(--border2);}
.assigned-badge{background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe;cursor:pointer;text-transform:none;letter-spacing:normal;transition:all .15s;}
.assigned-badge:hover{background:#ddd6fe;transform:translateY(-1px);}
.jc-date{font-size:0.85rem;color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:6px;font-weight:600;}

#detail{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);display:none;}
#detail-inner{padding:40px 48px;display:flex;flex-direction:column;gap:32px;max-width:1000px;margin:0 auto;width:100%;}

.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.dh-left h2{font-size:2.2rem;font-weight:900;letter-spacing:-.02em;color:var(--text);margin-bottom:6px;}
.dh-left .dref{font-family:'IBM Plex Mono',monospace;font-size:1rem;color:var(--muted);font-weight:500;line-height:1.5;}
.dh-right{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}

.btn-icon{
  background:var(--s1);border:1px solid var(--border2);
  padding:10px 18px;border-radius:8px;
  font-family:'Barlow',sans-serif;font-size:1rem;font-weight:700;
  color:var(--text);cursor:pointer;transition:all .15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.btn-icon:hover{border-color:var(--accent);color:var(--accent);background:#eff6ff;}
.btn-icon.red:hover{border-color:var(--red);color:var(--red);background:#fef2f2;}
.btn-icon.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn-icon.primary:hover{background:#1d4ed8;}

.stepper-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:12px;padding:24px 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.card-label{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
.stepper{display:flex;align-items:center;overflow-x:auto;gap:0;padding-bottom:8px}
.step{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-width:90px;cursor:pointer}
.step-circle{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;font-weight:600;font-family:'IBM Plex Mono',monospace;
  color:var(--muted);background:var(--s1);
  position:relative;z-index:1;transition:all .2s;
}
.step-circle.done{background:var(--green);border-color:var(--green);color:#fff}
.step-circle.current{border-color:var(--accent);color:var(--accent);background:#eff6ff;box-shadow:0 0 0 4px rgba(37,99,235,0.15)}
.step-label{font-size:0.95rem;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-align:center;line-height:1.4}
.step-label.current{color:var(--accent)}
.step-line{flex:1;height:3px;background:var(--border);margin-bottom:28px;transition:background .2s}
.step-line.done{background:var(--green)}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.info-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px 24px;box-shadow: 0 2px 8px rgba(0,0,0,0.03);}
.ic-label{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.ic-val{font-size:1.2rem;font-weight:800;color:var(--text);}
.ic-sub{font-size:1rem;font-family:'IBM Plex Mono',monospace;color:var(--muted2);margin-top:6px}

.section{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:28px 32px;box-shadow: 0 2px 8px rgba(0,0,0,0.03);}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.section-title{font-weight:800;font-size:1.3rem;letter-spacing:.01em;color:var(--text);}

.note-group{margin-bottom:24px}
.note-date-hdr{
  font-family:'IBM Plex Mono',monospace;font-size:1rem;
  color:var(--text);font-weight:700;
  border-left:3px solid var(--accent);
  padding-left:12px;margin-bottom:12px;
}
.note-item{
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:16px 20px;margin-bottom:10px;
}
.note-time{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;}
.note-author{color:var(--accent);font-weight:700;}
.note-text{font-size:1.1rem;line-height:1.6;color:var(--text);}

.note-form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.note-form-row{display:flex;gap:12px}
textarea.field{resize:vertical;min-height:90px;font-family:'Barlow',sans-serif;}
.btn-note{
  background:var(--accent);color:var(--accent-text);border:none;
  padding:12px 24px;border-radius:8px;
  font-family:'Barlow',sans-serif;font-weight:800;font-size:1rem;
  cursor:pointer;transition:all .15s;white-space:nowrap;
  box-shadow: 0 2px 4px rgba(37,99,235,0.2);
}
.btn-note:hover{background:#1d4ed8; transform: translateY(-1px);}

.media-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.media-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;font-size:1rem;font-weight:600;
}
.media-item a{color:var(--accent);text-decoration:none;}
.media-item a:hover{text-decoration:underline;}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
.media-thumb{
  aspect-ratio:1;border-radius:8px;
  overflow:hidden;border:1px solid var(--border2);
  cursor:pointer;position:relative;background:var(--bg);
}
.media-thumb img{width:100%;height:100%;object-fit:cover;transition:opacity .15s}
.media-thumb:hover img{opacity:.8}

.btn-upload-wrap{position:relative;display:inline-block;}
.btn-upload-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;}

.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.8);
  z-index:500;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--s1);border:none;
  border-radius:16px;width:90%;max-width:800px;
  max-height:90vh;overflow-y:auto;
  padding:40px;
  transform:translateY(20px);transition:transform .2s;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
}
.overlay.open .modal{transform:translateY(0)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.modal-title{font-size:1.6rem;font-weight:900;letter-spacing:-.01em;color:var(--text);}
.modal-close{background:var(--bg);border:none;border-radius:50%;width:36px;height:36px;color:var(--muted);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.modal-close:hover{background:#f1f5f9;color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-group.span2{grid-column:span 2}
.flabel{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;}

.tenant-list{display:flex;flex-direction:column;gap:12px;}
.tenant-row{display:flex;gap:12px;align-items:center;}
.btn-remove{background:var(--red);color:#fff;border:none;border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:800;}

.btn-tiny{
  background:var(--s3);border:1px solid var(--border2);
  padding:6px 12px;border-radius:6px;
  font-family:'Barlow',sans-serif;font-size:.85rem;font-weight:700;
  color:var(--text);cursor:pointer;transition:all .15s;
}
.btn-tiny:hover{border-color:var(--accent);color:var(--accent)}

.form-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border);}
.btn-cancel{
  background:var(--s1);border:1px solid var(--border2);
  padding:12px 28px;border-radius:8px;
  font-family:'Barlow',sans-serif;font-weight:700;font-size:1.05rem;
  color:var(--text);cursor:pointer;transition:all .15s;
}
.btn-cancel:hover{border-color:var(--red);color:var(--red);background:#fef2f2;}
.btn-save{
  background:var(--accent);color:var(--accent-text);border:none;
  padding:12px 32px;border-radius:8px;
  font-family:'Barlow',sans-serif;font-weight:800;font-size:1.05rem;
  cursor:pointer;transition:all .15s;
  box-shadow: 0 2px 4px rgba(37,99,235,0.2);
}
.btn-save:hover{background:#1d4ed8; transform: translateY(-1px);}
.btn-save:disabled{opacity:.6;cursor:default;}

.s-active{background:#e0f2fe;color:var(--blue)}
.s-contacted{background:#f3e8ff;color:var(--purple)}
.s-booked{background:#ffedd5;color:var(--orange)}
.s-completed{background:#dcfce7;color:var(--green)}
.s-cancelled{background:#fee2e2;color:var(--red)}
.s-revisit{background:#fef3c7;color:var(--yellow)}

.p-normal{background:var(--muted2)}
.p-urgent{background:var(--yellow)}
.p-emergency{background:var(--red)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.status-select-wrap{position:relative;display:inline-block}

/* ===== PAYMENT ADVICE ===== */
.pa-info-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;
  margin-bottom:20px;
}
.pa-info-box{
  background:var(--s3);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;
}
.pa-info-box .lbl{
  font-family:'IBM Plex Mono',monospace;font-size:0.8rem;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;
}
.pa-info-box .val{font-size:1rem;font-weight:700;color:var(--text);}
.pa-info-box .val a{color:var(--accent);text-decoration:none;}
.pa-info-box .val a:hover{text-decoration:underline;}

.pa-textarea{
  width:100%;min-height:260px;
  font-family:'IBM Plex Mono',monospace;font-size:1.05rem;line-height:1.7;
  background:var(--s3);border:1px solid var(--border2);border-radius:10px;
  padding:16px;color:var(--text);resize:vertical;
}
.pa-list{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
.pa-list-item{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--s1);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;cursor:pointer;transition:all .15s;
}
.pa-list-item:hover{border-color:var(--accent);background:#eff6ff;}
.pa-list-item .ref{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--accent);font-size:0.9rem;}
.pa-list-item .amt{font-weight:800;color:var(--text);}

.status-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--s1);border:1px solid var(--border2);
  border-radius:10px;padding:8px;z-index:300;
  display:none;min-width:220px;
  box-shadow:0 10px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
}
.status-dropdown.open{display:block}
.sd-item{
  padding:10px 16px;border-radius:6px;cursor:pointer;
  font-size:1rem;font-weight:700;transition:background .1s;
  display:flex;align-items:center;gap:12px;
}
.sd-item:hover{background:var(--bg)}

#lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  z-index:600;display:none;align-items:center;justify-content:center;
  cursor:pointer;
}
#lightbox.open{display:flex}
#lightbox img{max-width:90%;max-height:90%;border-radius:12px;object-fit:contain}

.topbar-back{display:none;background:none;border:none;color:var(--accent);font-size:1.1rem;font-weight:800;cursor:pointer;font-family:'Barlow',sans-serif;align-items:center;gap:6px}

.btn-tech{
  background:var(--s1);border:1px solid var(--border2);color:var(--muted2);
  padding:10px 18px;border-radius:8px;font-family:'Barlow',sans-serif;font-weight:700;
  font-size:1rem;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn-tech:hover{border-color:var(--accent);color:var(--accent);background:#eff6ff;}

#tech-panel{display:none;flex-direction:column;flex:1;overflow:hidden;}
.tech-toolbar{padding:20px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.tech-toolbar #tech-search{max-width:320px;}

#tech-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;
  padding:0 24px 24px 24px;overflow-y:auto;flex:1;align-content:start;
}
.tech-card{
  background:var(--s2);border:1px solid var(--border);border-radius:12px;
  padding:20px;transition:all .15s;box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  display:flex;flex-direction:column;gap:8px;
}
.tech-card:hover{border-color:var(--border2);box-shadow: 0 6px 16px rgba(0,0,0,0.06);}
.tech-name{font-size:1.15rem;font-weight:800;color:var(--text);}
.tech-row{font-size:0.95rem;color:var(--muted2);display:flex;align-items:center;gap:6px;}
.tech-row a{color:var(--accent);text-decoration:none;}
.tech-row a:hover{text-decoration:underline;}
.tech-notes{font-size:0.9rem;color:var(--muted);font-style:italic;margin-top:4px;}
.tech-tag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;font-weight:700;
  padding:4px 8px;border-radius:4px;background:#eff6ff;color:var(--accent);
  text-transform:uppercase;letter-spacing:.04em;align-self:flex-start;
}
.tech-actions{display:flex;gap:8px;margin-top:8px;}
.tech-actions button{flex:1;}

@media(max-width:768px){
  #topbar {
    height: auto;
    padding: 16px 20px;
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
  }
  .topbar-right {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .topbar-right .btn-add {
    grid-column: span 2;
    padding: 12px;
  }
  .topbar-right .btn-logout {
    grid-column: span 2;
  }
  .logo {
    text-align: center;
    font-size: 1.5rem;
  }
  #search-input, #date-filter {
    width: 100%;
  }
  .dh{flex-direction:column;gap:12px;}
  .dh-left h2{font-size:1.7rem;}
  .info-grid{grid-template-columns:1fr}
  .modal{padding:24px;width:95%;}
  .form-grid{grid-template-columns:1fr}
  .form-group.span2{grid-column:span 1}
  .tenant-row { flex-direction: column; align-items: stretch; }
}
</style>

<style>
.team-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;
  padding:24px;
}
.team-card{
  background:var(--s1);border:1px solid var(--border);border-radius:14px;
  padding:22px 20px;cursor:pointer;transition:all .15s;position:relative;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
}
.team-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.06);}
.team-avatar{
  width:56px;height:56px;border-radius:50%;background:#ede9fe;color:#5b21b6;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;
}
.team-name{font-weight:700;font-size:1.05rem;color:var(--text);}
.team-count{font-size:0.85rem;color:var(--muted);font-weight:600;}
.team-delete{
  position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:0.9rem;padding:4px;border-radius:6px;opacity:0;transition:opacity .15s;
}
.team-card:hover .team-delete{opacity:1;}
.team-delete:hover{background:#fee2e2;color:#991b1b;}
.add-person-card{
  border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;
  min-height:130px;color:var(--muted);font-weight:700;cursor:pointer;
}
.add-person-card:hover{border-color:var(--accent);color:var(--accent);}
.page-hdr{padding:24px 24px 0 24px;}
.page-hdr h1{font-size:1.5rem;font-weight:800;}
.page-hdr p{color:var(--muted);margin-top:4px;}
.back-link{
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;
  font-weight:600;font-size:0.9rem;margin-bottom:8px;
}
.back-link:hover{color:var(--accent);}
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:24px;}
.unassign-btn{
  margin-top:10px;width:100%;background:var(--s3);border:1px solid var(--border2);
  border-radius:8px;padding:8px;font-weight:600;font-size:0.85rem;color:var(--muted2);cursor:pointer;
}
.unassign-btn:hover{background:#fee2e2;color:#991b1b;border-color:#fecaca;}
.empty-msg{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);font-size:1.1rem;font-weight:600;}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="topbar-back" style="display:flex;">&larr; Tracker</a>
  <div class="logo">FIX AND GO<span> TEAM</span></div>
  <div class="topbar-right"></div>
</div>

<div id="team-view">
  <div class="page-hdr">
    <h1>Team</h1>
    <p>Click a name to see everything assigned to them.</p>
  </div>
  <div class="team-grid" id="team-grid"></div>
</div>

<div id="person-view" style="display:none;">
  <div class="page-hdr">
    <a href="#" class="back-link" onclick="showTeamView();return false;">&larr; Back to Team</a>
    <h1 id="person-name-hdr"></h1>
    <p id="person-count-hdr"></p>
  </div>
  <div class="job-grid" id="person-job-grid"></div>
</div>

<script>
const supabaseUrl = 'https://ojxqplxgyfokhkoyacic.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qeHFwbHhneWZva2hrb3lhY2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzg4MDcsImV4cCI6MjA5MzcxNDgwN30.G1m4yBF3MDMmpScVj9GQRDzZdy5TR38MxBowPHROlNY';
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

const STATUS_LABELS = {active:'Active',contacted:'Contacted',booked:'Booked',completed:'Completed',cancelled:'Cancelled',revisit:'Revisit'};
function statusClass(s){ return 'status-' + s; }
function priorityColor(p){ return p==='emergency' ? '#dc2626' : p==='urgent' ? '#f59e0b' : '#94a3b8'; }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

let teamMembers = [];
let allJobs = [];

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    document.body.innerHTML = '<div style="padding:60px;text-align:center;font-weight:700;">Please sign in via the main tracker first, then come back to this page.</div>';
    return;
  }
  await Promise.all([fetchTeamMembers(), fetchJobs()]);
  renderTeamGrid();

  const params = new URLSearchParams(window.location.search);
  const person = params.get('person');
  if(person) showPersonJobs(person);
}

async function fetchTeamMembers(){
  const { data, error } = await supabaseClient
    .from('team_members').select('*').is('archived_at', null).order('name');
  if(error){ console.error(error); return; }
  teamMembers = data || [];
}

async function fetchJobs(){
  const { data, error } = await supabaseClient
    .from('jobs').select('*').is('archived_at', null).order('created_at', { ascending:false });
  if(error){ console.error(error); return; }
  allJobs = data || [];
}

function renderTeamGrid(){
  const grid = document.getElementById('team-grid');
  const cards = teamMembers.map(t => {
    const count = allJobs.filter(j => j.assigned_to === t.name).length;
    const initial = (t.name||'?')[0].toUpperCase();
    return `
      <div class="team-card" onclick="showPersonJobs('${escHtml(t.name)}')">
        <button class="team-delete" onclick="event.stopPropagation();deletePerson('${t.id}','${escHtml(t.name)}')" title="Remove">&times;</button>
        <div class="team-avatar">${initial}</div>
        <div class="team-name">${escHtml(t.name)}</div>
        <div class="team-count">${count} job${count===1?'':'s'} assigned</div>
      </div>`;
  }).join('');

  grid.innerHTML = cards + `<div class="team-card add-person-card" onclick="addPerson()">+ Add Person</div>`;
}

async function addPerson(){
  const name = prompt('Name of the new team member:');
  if(!name || !name.trim()) return;
  const { error } = await supabaseClient.from('team_members').insert([{ name: name.trim() }]);
  if(error){ alert('Failed to add: ' + error.message); return; }
  await fetchTeamMembers();
  renderTeamGrid();
}

async function deletePerson(id, name){
  if(!confirm(`Remove ${name} from the team? Jobs already assigned to them will keep showing their name until reassigned.`)) return;
  const { error } = await supabaseClient.from('team_members').update({ archived_at: new Date().toISOString() }).eq('id', id);
  if(error){ alert('Failed to remove: ' + error.message); return; }
  await fetchTeamMembers();
  renderTeamGrid();
}

function showTeamView(){
  document.getElementById('team-view').style.display = 'block';
  document.getElementById('person-view').style.display = 'none';
  history.replaceState(null, '', 'team.html');
}

async function showPersonJobs(name){
  await fetchJobs();
  document.getElementById('team-view').style.display = 'none';
  document.getElementById('person-view').style.display = 'block';
  document.getElementById('person-name-hdr').textContent = name;

  const jobs = allJobs.filter(j => j.assigned_to === name);
  document.getElementById('person-count-hdr').textContent = `${jobs.length} job${jobs.length===1?'':'s'} assigned`;

  const grid = document.getElementById('person-job-grid');
  if(!jobs.length){
    grid.innerHTML = `<div class="empty-msg">No jobs currently assigned to ${escHtml(name)}.</div>`;
    return;
  }

  grid.innerHTML = jobs.map(j => {
    const tenantNames = (j.tenant || 'No Tenant');
    const sDate = j.scheduled_at ? ('Scheduled: ' + fmtDateTime(j.scheduled_at)) : 'Unscheduled';
    return `
    <div class="job-card">
      <div class="jc-top">
        <span class="jc-ref">${j.ref}</span>
        <span class="p-dot" style="background:${priorityColor(j.priority)}"></span>
      </div>
      <div class="jc-title">${escHtml(j.title || 'Untitled Job')}</div>
      <div class="jc-info-row">${escHtml(j.address || 'No Address')}</div>
      <div class="jc-info-row">Tenant: ${escHtml(tenantNames)}</div>
      <div class="jc-info-row">Tech: ${escHtml(j.tech || 'Unassigned')}</div>
      <div class="jc-tags">
        <span class="status-pill ${statusClass(j.status)}">${STATUS_LABELS[j.status]}</span>
      </div>
      <div class="jc-date">${sDate}</div>
      <button class="unassign-btn" onclick="unassignJob('${j.id}','${name}')">Unassign from ${escHtml(name)}</button>
    </div>`;
  }).join('');
}

async function unassignJob(jobId, name){
  if(!confirm('Remove this assignment?')) return;
  const { error } = await supabaseClient.from('jobs').update({ assigned_to: null }).eq('id', jobId);
  if(error){ alert('Failed: ' + error.message); return; }
  showPersonJobs(name);
}

init();
</script>
</body>
</html>
